plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.facetrack.standalone'
    compileSdk 35

    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId "com.facetrack.standalone"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 支持架构: 骁龙8 Elite / 天玑9400+ / 麒麟9010 均为 ARM64
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                targets "facetrack_standalone"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1+"
        }
    }

    buildFeatures {
        viewBinding false
    }

    // assets 目录 (存放 face_landmarker.task 模型)
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    // Android Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // MediaPipe Tasks Vision (面部识别)
    // 支持 GPU 加速 (Adreno 830/750, Immortalis-G925, Maleoon 910)
    // 支持 NNAPI 加速 (Hexagon NPU, APU 790, Da Vinci NPU)
    implementation 'com.google.mediapipe:tasks-vision:0.10.16'

    // CameraX (摄像头)
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // USB UVC external cameras for Quest/Pico capture validation
    implementation 'com.herohan:UVCAndroid:1.0.12'

    // 协程
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
