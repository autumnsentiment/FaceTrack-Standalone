workflows:
  ios-ipa:
    name: FaceTrackStandalone iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 15.4
      cocoapods: default
      vars:
        EXPORT_METHOD: development
      ios_signing:
        distribution_type: development
        bundle_identifier: com.facetrack.standalone.ios
    scripts:
      - name: Install pods
        script: |
          cd ios
          pod install
      - name: Build IPA
        script: |
          cd ios
          chmod +x scripts/build-ipa.sh
          ./scripts/build-ipa.sh
    artifacts:
      - ios/build/export/*.ipa
      - ios/build/*.xcarchive
